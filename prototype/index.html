<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline prototype – viewer</title>
<link rel="stylesheet" href="vector-stub.css">
<style>
	/* Prototype viewer: the article sits in an iframe whose width you drag,
	   so the timeline's media queries react to the frame, not the window. */
	body { overflow-x: hidden; }
	.bar {
		display: flex; flex-wrap: wrap; gap: 0.5em 1em; align-items: center;
		padding: 0.5em 1em; border-bottom: 1px solid var( --border-color-subtle );
		background: var( --background-color-base ); font-size: 0.9em;
	}
	.bar output { font-variant-numeric: tabular-nums; min-width: 6em; }
	.bar button {
		padding: 0.2em 0.7em; border: 1px solid var( --border-color-base ); border-radius: 2px;
		background: var( --background-color-interactive-subtle ); color: var( --color-base );
		font: inherit; cursor: pointer;
	}
	.bar button:hover { border-color: var( --color-progressive ); }
	.bar .spacer { flex: 1; }
	.stage {
		display: flex; justify-content: center; align-items: stretch;
		padding: 1em 0; height: calc( 100vh - 4.5em ); min-height: 20em;
	}
	.frame-wrap { position: relative; flex: none; width: 1000px; max-width: 100%; }
	iframe {
		display: block; width: 100%; height: 100%;
		border: 1px solid var( --border-color-base ); background: var( --background-color-base );
	}
	.dragging iframe { pointer-events: none; }
	.dragging, .dragging * { cursor: ew-resize !important; user-select: none; }
	.handle {
		flex: none; width: 18px; margin: 0 4px; border-radius: 4px; cursor: ew-resize;
		background: var( --background-color-interactive-subtle ); border: 1px solid var( --border-color-base );
		display: flex; align-items: center; justify-content: center; touch-action: none;
	}
	.handle::before { content: ''; width: 4px; height: 36px; border-left: 1px solid var( --color-subtle ); border-right: 1px solid var( --color-subtle ); }
	.handle:hover, .handle:focus-visible { border-color: var( --color-progressive ); outline: none; }
	@media ( max-width: 480px ) { .handle { display: none; } }
</style>
</head>
<body>
<div class="bar">
	<strong>Timeline prototype</strong>
	<span>Drag the side handles, or focus one and use ← →.</span>
	<output id="width" aria-live="polite"></output>
	<button type="button" data-w="375">375</button>
	<button type="button" data-w="640">640</button>
	<button type="button" data-w="768">768</button>
	<button type="button" data-w="1000">1000</button>
	<button type="button" data-w="max">Max</button>
	<span data-theme-slot></span>
	<span class="spacer"></span>
	<a href="alone.html">Timeline alone</a>
	<a href="https://github.com/psygo/wikipedia_timeline">Source</a>
</div>
<div class="stage" id="stage">
	<div class="handle" id="hl" role="separator" aria-orientation="vertical" aria-label="Narrow or widen the page (left edge)" tabindex="0"></div>
	<div class="frame-wrap" id="wrap"><iframe src="article.html" title="Mock article with timeline"></iframe></div>
	<div class="handle" id="hr" role="separator" aria-orientation="vertical" aria-label="Narrow or widen the page (right edge)" tabindex="0"></div>
</div>
<script src="theme-toggle.js"></script>
<script>
// Keep the address bar in step with the framed article: a link such as
// index.html#Edo_period opens the article at that anchor, and following a contents
// link or clicking a timeline section updates this page's URL.
( function () {
	var frame = document.querySelector( 'iframe' );
	if ( location.hash ) { frame.src = 'article.html' + location.hash; }
	window.addEventListener( 'message', function ( e ) {
		if ( e.source === frame.contentWindow && e.data && typeof e.data.wtHash === 'string' ) {
			history.replaceState( null, '', location.pathname + location.search + e.data.wtHash );
		}
	} );
	window.addEventListener( 'hashchange', function () {
		frame.contentWindow.postMessage( { wtGoto: location.hash }, '*' );
	} );
}() );
</script>
<script>
( function () {
	var stage = document.getElementById( 'stage' );
	var wrap = document.getElementById( 'wrap' );
	var out = document.getElementById( 'width' );
	var MIN = 280;

	function maxWidth() {
		return Math.max( MIN, stage.clientWidth - 2 * 26 );
	}
	function set( w ) {
		w = Math.round( Math.min( maxWidth(), Math.max( MIN, w ) ) );
		wrap.style.width = w + 'px';
		out.textContent = 'Width: ' + w + ' px';
		return w;
	}
	function current() {
		return wrap.getBoundingClientRect().width;
	}

	// Both edges move symmetrically, so the page stays centred under the cursor.
	// Pointer capture keeps move/up events on the handle even if the pointer
	// leaves the window; every exit path clears the "dragging" state, otherwise
	// the iframe would stay inert (pointer-events: none) and could not scroll.
	function drag( side ) {
		return function ( e ) {
			var el = e.currentTarget;
			e.preventDefault();
			var startX = e.clientX, startW = current();
			try { el.setPointerCapture( e.pointerId ); } catch ( err ) {}
			document.body.classList.add( 'dragging' );
			function move( ev ) {
				if ( ev.buttons === 0 ) { end(); return; } // button released unseen
				set( startW + ( side === 'right' ? 2 : -2 ) * ( ev.clientX - startX ) );
			}
			function end() {
				document.body.classList.remove( 'dragging' );
				el.removeEventListener( 'pointermove', move );
				el.removeEventListener( 'pointerup', end );
				el.removeEventListener( 'pointercancel', end );
				el.removeEventListener( 'lostpointercapture', end );
				window.removeEventListener( 'blur', end );
			}
			el.addEventListener( 'pointermove', move );
			el.addEventListener( 'pointerup', end );
			el.addEventListener( 'pointercancel', end );
			el.addEventListener( 'lostpointercapture', end );
			window.addEventListener( 'blur', end );
		};
	}
	function keys( side ) {
		return function ( e ) {
			var step = e.shiftKey ? 50 : 10, d = 0;
			if ( e.key === 'ArrowRight' ) { d = side === 'right' ? step : -step; }
			if ( e.key === 'ArrowLeft' ) { d = side === 'right' ? -step : step; }
			if ( d ) { e.preventDefault(); set( current() + 2 * d ); }
		};
	}
	[ [ 'hl', 'left' ], [ 'hr', 'right' ] ].forEach( function ( p ) {
		var el = document.getElementById( p[ 0 ] );
		el.addEventListener( 'pointerdown', drag( p[ 1 ] ) );
		el.addEventListener( 'keydown', keys( p[ 1 ] ) );
	} );
	Array.prototype.forEach.call( document.querySelectorAll( '[data-w]' ), function ( b ) {
		b.addEventListener( 'click', function () {
			set( b.dataset.w === 'max' ? 99999 : +b.dataset.w );
		} );
	} );
	window.addEventListener( 'resize', function () { set( current() ); } );
	set( Math.min( 1000, maxWidth() ) );
}() );
</script>
</body>
</html>
